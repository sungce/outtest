<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 감독관 관리자 설정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="py-10 px-4">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-xl shadow-md p-8 border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                <span class="mr-2">⚙️</span> 시험 정보 설정 (관리자용)
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600">시험명 (신청 페이지 제목의 "외부"를 대체합니다)</label>
                    <input type="text" id="inputTitle" placeholder="예: 토익, 기말고사" 
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600">일시</label>
                    <input type="text" id="inputDateTime" placeholder="예: 2026년 6월 15일(토) 09:00 ~ 13:00"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600">장소</label>
                    <input type="text" id="inputLocation" placeholder="예: 본교 각 고사실"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600">감독 수당</label>
                    <input type="text" id="inputFee" placeholder="예: 60,000원"
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
            </div>

            <button onclick="saveSettings()" class="w-full mt-8 bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-black transition shadow-lg">
                설정 저장 및 적용하기
            </button>
            <p id="saveMsg" class="text-center text-blue-600 mt-4 font-medium hidden">✅ 설정이 저장되었습니다.</p>

            <!-- 공유 링크 섹션 -->
            <div id="linkSection" class="mt-6 hidden">
                <hr class="my-4 border-gray-200">

                <!-- 원본 긴 링크 -->
                <p class="text-sm font-semibold text-gray-600 mb-2">📎 신청 페이지 공유 링크</p>
                <div class="flex gap-2">
                    <input type="text" id="shareLink" readonly
                        class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-md bg-gray-50 text-gray-700 outline-none">
                    <button onclick="copyLink('shareLink', 'copyMsg')"
                        class="px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-md hover:bg-blue-700 transition whitespace-nowrap">
                        복사
                    </button>
                </div>
                <p id="copyMsg" class="text-green-600 text-sm mt-1 font-medium hidden">✅ 링크가 복사되었습니다!</p>

                <!-- 단축 URL 버튼 및 결과 -->
                <div class="mt-3">
                    <button id="shortenBtn" onclick="shortenUrl()"
                        class="w-full py-2 border-2 border-dashed border-gray-300 text-gray-500 text-sm font-semibold rounded-lg hover:border-blue-400 hover:text-blue-500 hover:bg-blue-50 transition flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                        </svg>
                        🔗 단축 URL 만들기
                    </button>

                    <!-- 단축 URL 결과 (초기 숨김) -->
                    <div id="shortUrlSection" class="hidden mt-3">
                        <p class="text-sm font-semibold text-gray-600 mb-2">✂️ 단축된 링크 (선생님들께 이 링크를 공유하세요)</p>
                        <div class="flex gap-2">
                            <input type="text" id="shortUrl" readonly
                                class="flex-1 px-3 py-2 text-sm border-2 border-green-400 rounded-md bg-green-50 text-green-800 font-bold outline-none">
                            <button onclick="copyLink('shortUrl', 'copyShortMsg')"
                                class="px-4 py-2 bg-green-600 text-white text-sm font-bold rounded-md hover:bg-green-700 transition whitespace-nowrap">
                                복사
                            </button>
                        </div>
                        <p id="copyShortMsg" class="text-green-600 text-sm mt-1 font-medium hidden">✅ 단축 링크가 복사되었습니다!</p>
                    </div>

                    <!-- 로딩 / 오류 메시지 -->
                    <p id="shortenLoading" class="text-center text-blue-500 text-sm mt-2 hidden">⏳ 단축 URL 생성 중...</p>
                    <p id="shortenError" class="text-center text-red-500 text-sm mt-2 hidden"></p>
                </div>

                <p class="text-xs text-gray-400 mt-3">
                    ⚠️ 선생님들은 반드시 이 링크로 접속해야 시험명이 올바르게 기록됩니다.
                </p>
            </div>
        </div>
    </div>

    <script>
        const INDEX_FILE = 'index.html';

        window.onload = function() {
            const saved = JSON.parse(localStorage.getItem('proctorSettings'));
            if (saved) {
                document.getElementById('inputTitle').value = saved.title || '';
                document.getElementById('inputDateTime').value = saved.dateTime || '';
                document.getElementById('inputLocation').value = saved.location || '';
                document.getElementById('inputFee').value = saved.fee || '';
                generateLink(saved);
                document.getElementById('linkSection').classList.remove('hidden');
            }
        }

        function saveSettings() {
            const settings = {
                title: document.getElementById('inputTitle').value.trim(),
                dateTime: document.getElementById('inputDateTime').value.trim(),
                location: document.getElementById('inputLocation').value.trim(),
                fee: document.getElementById('inputFee').value.trim()
            };
            if (!settings.title) { alert('시험명을 입력해주세요.'); return; }

            localStorage.setItem('proctorSettings', JSON.stringify(settings));
            generateLink(settings);

            // 설정 변경 시 단축 URL 초기화
            document.getElementById('shortUrlSection').classList.add('hidden');
            document.getElementById('shortenError').classList.add('hidden');
            document.getElementById('shortenBtn').classList.remove('hidden');

            const msg = document.getElementById('saveMsg');
            msg.classList.remove('hidden');
            document.getElementById('linkSection').classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        }

        function generateLink(settings) {
            const base = window.location.href.replace(/admin\.html.*$/, '');
            const params = new URLSearchParams({
                title: settings.title || '',
                dateTime: settings.dateTime || '',
                location: settings.location || '',
                fee: settings.fee || ''
            });
            const link = base + INDEX_FILE + '?' + params.toString();
            document.getElementById('shareLink').value = link;
        }

        // ── 단축 URL ──────────────────────────────────────────
        async function shortenUrl() {
            const longUrl = document.getElementById('shareLink').value;
            if (!longUrl) return;

            const loading = document.getElementById('shortenLoading');
            const errEl   = document.getElementById('shortenError');
            const btn     = document.getElementById('shortenBtn');

            loading.classList.remove('hidden');
            errEl.classList.add('hidden');
            btn.disabled = true;

            // 순차 시도: is.gd → tinyurl (CORS 프록시 경유)
            const shortened = await tryIsGd(longUrl) || await tryTinyUrl(longUrl);

            loading.classList.add('hidden');
            btn.disabled = false;

            if (shortened) {
                document.getElementById('shortUrl').value = shortened;
                document.getElementById('shortUrlSection').classList.remove('hidden');
                btn.classList.add('hidden'); // 성공하면 버튼 숨김
            } else {
                errEl.textContent = '❌ 단축 URL 생성에 실패했습니다. 원본 링크를 사용해주세요.';
                errEl.classList.remove('hidden');
            }
        }

        // is.gd API (CORS 지원)
        async function tryIsGd(url) {
            try {
                const res = await fetch(
                    'https://is.gd/create.php?format=simple&url=' + encodeURIComponent(url),
                    { signal: AbortSignal.timeout(6000) }
                );
                if (!res.ok) return null;
                const text = (await res.text()).trim();
                return text.startsWith('http') ? text : null;
            } catch { return null; }
        }

        // TinyURL API (CORS 프록시 경유)
        async function tryTinyUrl(url) {
            try {
                const res = await fetch(
                    'https://api.allorigins.win/get?url=' +
                    encodeURIComponent('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(url)),
                    { signal: AbortSignal.timeout(8000) }
                );
                if (!res.ok) return null;
                const data = await res.json();
                const text = (data.contents || '').trim();
                return text.startsWith('http') ? text : null;
            } catch { return null; }
        }

        // ── 복사 공통 함수 ────────────────────────────────────
        function copyLink(inputId, msgId) {
            const input = document.getElementById(inputId);
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value).then(() => {
                showCopyMsg(msgId);
            }).catch(() => {
                try { document.execCommand('copy'); showCopyMsg(msgId); }
                catch { alert('링크를 복사해 주세요: ' + input.value); }
            });
        }

        function showCopyMsg(msgId) {
            const el = document.getElementById(msgId);
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 2000);
        }
    </script>
</body>
</html>
