<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 감독관 신청</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; position: relative; min-height: 100vh; }
        
        /* [중요] 관리자 버튼 스타일 - z-index를 최상위로 설정 */
        .admin-link {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: white;
            color: #94a3b8;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 9999 !important;
        }
        .admin-link:hover {
            color: #2563eb;
            transform: rotate(90deg);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        .info-box { background-color: #f0f7ff; border-left: 5px solid #3b82f6; padding: 1.5rem; color: #1e40af; }
    </style>
</head>
<body class="py-10 px-4">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-8 relative">
        <div class="text-center mb-8">
            <h1 id="mainTitle" class="text-2xl font-bold text-gray-900">외부 시험 감독관 위촉 신청</h1>
            <p class="text-gray-500 mt-2">정확한 정보를 입력해 주세요.</p>
        </div>

        <div id="infoPreview" class="info-box mb-8">
            <span id="displayTitle" class="font-bold text-lg block mb-2">[시험 안내]</span>
            <p>일시: <span id="displayDateTime">관리자 설정을 확인해주세요</span></p>
            <p>장소: <span id="displayLocation">관리자 설정을 확인해주세요</span></p>
            <p>수당: <span id="displayFee">관리자 설정을 확인해주세요</span></p>
        </div>

        <form id="applyForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">성명</label>
                <input type="text" id="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">연락처</label>
                <input type="tel" id="phone" required placeholder="010-0000-0000" class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">직책 구분</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer hover:bg-blue-50">
                        <input type="radio" name="position" value="교원" class="mr-2" checked> 교원
                    </label>
                    <label class="flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer hover:bg-blue-50">
                        <input type="radio" name="position" value="교직원" class="mr-2"> 교직원
                    </label>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg hover:bg-blue-700 shadow-lg transition">
                위촉 신청하기
            </button>
        </form>

        <div id="successMsg" class="hidden text-center py-12">
            <div class="text-green-500 text-5xl mb-4">✓</div>
            <h2 class="text-2xl font-bold text-gray-800">신청이 완료되었습니다!</h2>
            <button onclick="location.reload()" class="mt-6 text-blue-600 underline text-sm">새로 작성</button>
        </div>
    </div>

    <div class="admin-link" onclick="checkAdminPassword()" title="관리자 설정">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyDPiSRWcphLS-_7XcBcyymTEt8iv2W1zj7i7diGKpOzotu4bgMYrV_5e1yOrJ-D-Kd/exec";

        // ✅ 핵심 수정: URL 파라미터 우선 → localStorage 차선
        function loadSettings() {
            const params = new URLSearchParams(window.location.search);

            // URL 파라미터에서 시험명 확인
            const urlTitle = params.get('title');

            if (urlTitle) {
                // URL 파라미터로 접속한 경우 (관리자가 공유한 링크)
                return {
                    title:    urlTitle,
                    dateTime: params.get('dateTime') || '',
                    location: params.get('location') || '',
                    fee:      params.get('fee') || ''
                };
            }

            // URL 파라미터 없으면 localStorage 확인 (같은 브라우저에서 직접 열 때)
            const saved = JSON.parse(localStorage.getItem('proctorSettings'));
            return saved || null;
        }

        // 페이지 로드 시 설정 적용
        window.onload = function() {
            const settings = loadSettings();
            if (settings && settings.title) {
                const mainTitle = document.getElementById('mainTitle');
                mainTitle.innerText = mainTitle.innerText.replace("외부", settings.title);
                document.getElementById('displayTitle').innerText = "[" + settings.title + " 안내]";
                document.getElementById('displayDateTime').innerText = settings.dateTime || "미지정";
                document.getElementById('displayLocation').innerText = settings.location || "미지정";
                document.getElementById('displayFee').innerText = settings.fee || "미지정";
            }
        }

        // 비밀번호 확인 함수
        function checkAdminPassword() {
            const adminPassword = "6359";
            const userInput = prompt("관리자 비밀번호를 입력하세요.");
            if (userInput === adminPassword) {
                window.location.href = "admin.html";
            } else if (userInput !== null) {
                alert("비밀번호가 틀렸습니다.");
            }
        }

        // 신청서 제출 로직
        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "제출 중...";

            // ✅ 핵심 수정: URL 파라미터 우선으로 시험명 가져오기
            const settings = loadSettings();
            const currentExamName = (settings && settings.title) ? settings.title : "미지정 시험";

            const payload = {
                examName:  currentExamName,
                name:      document.getElementById('name').value,
                phone:     document.getElementById('phone').value,
                position:  document.querySelector('input[name="position"]:checked').value,
                timestamp: new Date().toLocaleString('ko-KR')
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('applyForm').classList.add('hidden');
                document.getElementById('infoPreview').classList.add('opacity-50');
                document.getElementById('successMsg').classList.remove('hidden');
            } catch (err) {
                alert("오류 발생");
                btn.disabled = false;
                btn.innerText = "위촉 신청하기";
            }
        });
    </script>
</body>
</html>
